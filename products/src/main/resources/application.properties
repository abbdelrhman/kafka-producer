spring.application.name=productManagement
server.port=8086


spring.datasource.url=jdbc:mysql://localhost:3307/Product
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect



spring.kafka.producer.bootstrap-servers=localhost:9092,localhost:9094
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Base path
server.servlet.context-path=/productManagement/api

# SpringDoc settings
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.paths-to-match=/v1/products/**

# Kafka Topic Configuration
kafka.topic.product-created.name=product-created-events-topic
kafka.topic.product-created.partitions=3
kafka.topic.product-created.replicas=3
kafka.topic.product-created.min-insync-replicas=2


# Kafka config how many ACKs required from kafka cluster for the producer before considering a record sent
#spring.kafka.producer.acks=1   #ack only from the leader and 1 here is the default no need to mention it

#ack from the leader and all the follower (insync-replicas)
spring.kafka.producer.acks=all

#number of retries kafak producer will attempt to make sure that the message is sent to kafak broker, if it fails at the first time
#the default value is very large (max)
#spring.kafka.producer.retries=10
##the amount of time the producer waits before attempt again to resend / retry
#spring.kafka.producer.properties.retry.backoff.ms=1000

# another way insted of the last two properties is to use the delivery time out
# it is about the whole journey time including sending request, receiving acks and retrying failed attempts for response
# it's value must be >= linger + request
spring.kafka.producer.properties.delivery.timeout.ms=12000

#producer will wait max 100 ms to buffer data(messages) instead of one message ,compress it and sending it in batch to broker
spring.kafka.producer.properties.linger.ms=100
#time to wait for a response form kafka broker
spring.kafka.producer.properties.request.timeout.ms=3000

#kafka idempotence , to make sure that the message will not exist twice in kafka broker in presence of failure and retrials
spring.kafka.producer.properties.enable.idempotence=true
#the following property must be <= 5
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5